<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Docker Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #1f4e79;
        }

        h2 {
            color: #2e7d32;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .status {
            display: inline-block;
            padding: 12px 25px;
            margin-top: 15px;
            border-radius: 25px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Jenkins + Docker Demo</h1>

        <h2>Deployment Successful 🚀</h2>

        <p>
            This application was built and deployed using Jenkins and Docker.
        </p>

        <div class="status">
            BUILD SUCCESSFUL
        </div>

        <div class="status">
            DEPLOYMENT SUCCESSFUL
        </div>

    </div>

</body>
</html>
